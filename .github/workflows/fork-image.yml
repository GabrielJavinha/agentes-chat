# This fork's own image, for a server that installed agentes.chat with its installer and runs this fork instead:
# its .env sets AGENTES_IMAGE=ghcr.io/<owner>/agentes:latest, and `docker compose pull && docker compose up -d`
# updates it, as with the original's image. Built from the Dockerfile, for arm64, on every push to this fork's main (the version
# its server runs) and by hand from the Actions tab. The original's CI (ci.yml) builds and publishes the original's
# images, so this one runs only in this fork.
name: Fork image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish
    if: github.repository == 'GabrielJavinha/agentes-chat'
    # Built natively on GitHub's ARM runner: the server is arm64 (aarch64).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The registry takes lowercase names only: ghcr.io/gabrieljavinha/agentes.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      # arm64 only: the server this fork runs on. A sha- tag per commit holds a version, as AGENTES_IMAGE can pin.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fork-image
          cache-to: type=gha,scope=fork-image,mode=max
